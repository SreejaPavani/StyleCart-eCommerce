{% extends "base.html" %}

{% block title %}
Login | StyleCart
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <h2 class="text-center mb-4">
                Welcome Back
            </h2>


            <form method="POST">

                <input
                type="email"
                name="email"
                class="form-control mb-3"
                placeholder="Email"
                required>


                <input
                type="password"
                name="password"
                class="form-control mb-3"
                placeholder="Password"
                required>


                <button
                class="btn btn-dark w-100">

                    LOGIN

                </button>

            </form>


            <p class="text-center mt-3">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
